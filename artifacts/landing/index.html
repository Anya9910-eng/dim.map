        <h1>DraftFly — AI drafts your cold-email replies, you approve in one click</h1>
        <p>Get on-brand replies to your Lemlist campaign responses drafted and waiting for you before you've even seen the prospect's email — powered by AI, approved in one click in Slack or the dashboard. Built for cold-outreach agencies and SDR teams.</p>
        <p><a href="/app/signup">Start a free 3-day trial</a> — no card needed.</p>

        <h2>How it works</h2>
        <ol>
          <li><strong>Intercept.</strong> DraftFly watches your Lemlist campaigns and pulls positive or interrogative replies the moment they arrive.</li>
          <li><strong>Draft.</strong> AI writes a contextual, persona-matched reply in your voice in seconds.</li>
          <li><strong>Route.</strong> The draft, the context and the original thread land in Slack or the dashboard.</li>
          <li><strong>Approve.</strong> One click sends it — or edit first. Nothing leaves your domain without a human.</li>
        </ol>

        <h2>Pricing</h2>
        <p>Every plan starts with a 3-day free trial, no card. <strong>Starter — $49/mo</strong>: 2 active campaigns, 100 replies per month. <strong>Growth — $149/mo</strong>: 10 active campaigns, 500 replies per month. Pay monthly, cancel anytime.</p>

        <h2>Common questions</h2>
        <h3>What does DraftFly actually do?</h3>
        <p>When a reply to your cold-email campaign arrives, DraftFly detects it, generates an on-brand draft with AI, and routes it to Slack or the dashboard for human approval before anything is sent.</p>
        <h3>What sending tools does it work with?</h3>
        <p>Lemlist is live today. Smartlead, Instantly, Gmail Workspace, Outlook, HubSpot and Salesforce are on the roadmap. DraftFly sits on top of your sending tool — there is nothing to migrate.</p>
        <h3>Does it replace my SDRs?</h3>
        <p>No — every draft needs human approval before it sends. DraftFly removes the writing time, not the judgment call.</p>

        <p>Questions? Email <a href="mailto:outreach@draftfly.app">outreach@draftfly.app</a>.</p>
