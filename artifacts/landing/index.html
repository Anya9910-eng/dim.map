        <h1>DIM Convert — every property lead, qualified and answered</h1>
        <p>DIM Convert pulls in the leads from your cold email campaigns, Meta (Facebook and Instagram), Google Ads and YouTube lead ads, and WhatsApp, qualifies each buyer as hot, warm or cold, and drafts the reply — so your agents spend their day on viewings, not inboxes. Built for property developers and real-estate brokers.</p>
        <p><a href="/app/signup">Start a free 3-day trial</a> — no card needed.</p>

        <h2>How it works</h2>
        <ol>
          <li><strong>Capture.</strong> Replies to your Lemlist campaigns, lead forms from Meta, Google Ads and YouTube, and WhatsApp chats land in one inbox.</li>
          <li><strong>Qualify.</strong> AI reads budget, timeline, financing and unit type and grades every buyer.</li>
          <li><strong>Draft.</strong> A reply in your project's voice, on the right channel — never an invented price or handover date.</li>
          <li><strong>Approve.</strong> One click sends it back on WhatsApp or email.</li>
        </ol>

        <h2>Pricing</h2>
        <p>Every plan starts with a 3-day free trial, no card. <strong>Starter — $49/mo</strong>: 2 active campaigns, 100 leads per month. <strong>Growth — $149/mo</strong>: 10 active campaigns, 500 leads per month. Pay monthly, cancel anytime.</p>

        <h2>Common questions</h2>
        <h3>Which channels does it work with?</h3>
        <p>Lemlist, Meta Lead Ads, Google Ads and YouTube lead forms, and WhatsApp Business are live today. CRM sync is on the roadmap.</p>
        <h3>Does it replace my sales agents?</h3>
        <p>No — every reply needs a person's approval before it sends. DIM Convert does the first touch and the triage; your team does the viewings and the closing.</p>

        <p>Questions? Email <a href="mailto:outreach@draftfly.app">outreach@draftfly.app</a>.</p>
