kind = "web"
previewPath = "/app"
title = "DraftFly"
version = "1.0.0"
id = "artifacts/draftfly"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/app" ]
localPort = 20302

[services.development]
run = "pnpm --filter @workspace/draftfly run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/draftfly", "run", "build" ]
publicDir = "artifacts/draftfly/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20302"
BASE_PATH = "/app"
