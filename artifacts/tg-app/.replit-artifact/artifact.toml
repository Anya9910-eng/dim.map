kind = "web"
previewPath = "/tg/"
title = "DraftFly Telegram"
version = "1.0.0"
id = "artifacts/tg-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/tg/" ]
localPort = 23764

[services.development]
run = "pnpm --filter @workspace/tg-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tg-app", "run", "build" ]
publicDir = "artifacts/tg-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23764"
BASE_PATH = "/tg/"
