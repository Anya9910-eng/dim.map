# DIM Convert (convert.dim.capital) vhost for the host-level nginx.
#
# Runs next to DraftFly on the same server: DraftFly keeps its own vhost and
# its 172.18.0.1:8080 upstream; DIM Convert is published on its own bridge
# gateway and port (APP_BIND in deploy/.env, 172.28.0.1:8081 by default).
#
# Install:
#   cp deploy/nginx-dimconvert.conf /etc/nginx/sites-available/dimconvert.conf
#   ln -s /etc/nginx/sites-available/dimconvert.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d convert.dim.capital   # adds TLS + the http→https redirect
server {
    listen 80;
    listen [::]:80;
    server_name convert.dim.capital;

    client_max_body_size 20m;

    location / {
        # Must match APP_BIND in deploy/.env.
        proxy_pass http://172.28.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required: the app trusts the proxy and only sets its secure session
        # cookie when this header says https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
