# DraftFly vhost for a host-level nginx (when ports 80/443 are already taken
# by nginx and the Caddy service is not used).
#
# Install:
#   cp deploy/nginx-draftfly.conf /etc/nginx/sites-available/draftfly.conf
#   ln -s /etc/nginx/sites-available/draftfly.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d draftfly.app -d www.draftfly.app   # adds TLS + redirect
server {
    listen 80;
    listen [::]:80;
    server_name draftfly.app www.draftfly.app;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required: the app trusts the proxy and only sets its secure session
        # cookie when this header says https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
